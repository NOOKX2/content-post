services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_post
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content_post"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_post?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production-min-32-chars}
      AUTH_URL: http://localhost:3000
      APP_PUBLIC_URL: http://localhost:3000
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-dev-n8n-api-key-change-in-production}
      # Compose DNS. Host `bun run dev` uses localhost via dispatch helper / .env.
      N8N_WEBHOOK_URL: http://n8n:5678
      BUFFER_API_KEY: ${BUFFER_API_KEY:-}
      BUFFER_ORG_ID: ${BUFFER_ORG_ID:-}
      BUFFER_IG_CHANNEL_ID: ${BUFFER_IG_CHANNEL_ID:-}
      BUFFER_TIKTOK_CHANNEL_ID: ${BUFFER_TIKTOK_CHANNEL_ID:-}
      BUFFER_FB_CHANNEL_ID: ${BUFFER_FB_CHANNEL_ID:-}
      BUFFER_YOUTUBE_CHANNEL_ID: ${BUFFER_YOUTUBE_CHANNEL_ID:-}
      BUFFER_CHANNEL_MAP: ${BUFFER_CHANNEL_MAP:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    command: ["dev"]

  studio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_post?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["studio"]

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: postgres
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-n8n-encryption-key-change-in-production}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_EXPRESSIONS_ALLOWED_ENV_VARS: "BUFFER_API_KEY,BUFFER_IG_CHANNEL_ID,BUFFER_TIKTOK_CHANNEL_ID,BUFFER_FB_CHANNEL_ID,BUFFER_YOUTUBE_CHANNEL_ID,N8N_API_KEY,APP_PUBLIC_URL"
      N8N_API_KEY: ${N8N_API_KEY:-dev-n8n-api-key-change-in-production}
      BUFFER_API_KEY: ${BUFFER_API_KEY:-}
      BUFFER_IG_CHANNEL_ID: ${BUFFER_IG_CHANNEL_ID:-}
      BUFFER_TIKTOK_CHANNEL_ID: ${BUFFER_TIKTOK_CHANNEL_ID:-}
      BUFFER_FB_CHANNEL_ID: ${BUFFER_FB_CHANNEL_ID:-}
      BUFFER_YOUTUBE_CHANNEL_ID: ${BUFFER_YOUTUBE_CHANNEL_ID:-}
      APP_PUBLIC_URL: ${AUTH_URL:-http://localhost:3000}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
  n8n_data:
